<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMA Live Chart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; }

.header {
    background: linear-gradient(135deg, #111118 0%, #0d0d14 100%);
    border-bottom: 1px solid #1a1a2e;
    padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
}
.header h1 { font-size: 18px; font-weight: 600; color: #fff; }
.header h1 span { color: #ffd700; }
.header .meta { font-size: 12px; color: #888; }

.container { display: flex; height: calc(100vh - 56px); }

.chart-area {
    flex: 1; position: relative; padding: 10px;
    display: flex; flex-direction: column;
}
canvas#chart { flex: 1; width: 100%; cursor: crosshair; }

.sidebar {
    width: 360px; background: #111118; border-left: 1px solid #1a1a2e;
    padding: 14px; overflow-y: auto; font-size: 12px;
}
.sidebar h2 {
    font-size: 12px; color: #666; text-transform: uppercase;
    letter-spacing: 1px; margin: 16px 0 8px 0;
}
.sidebar h2:first-child { margin-top: 0; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card {
    background: #151520; border-radius: 6px; padding: 10px;
    border: 1px solid #1a1a2e;
}
.stat-value { font-size: 20px; font-weight: 700; }
.stat-value.green { color: #26a69a; }
.stat-value.red { color: #ef5350; }
.stat-value.gold { color: #ffd700; }
.stat-label { font-size: 10px; color: #555; margin-top: 2px; }

.bar-row {
    display: flex; align-items: center; padding: 5px 8px; border-radius: 4px;
    margin-bottom: 2px; gap: 6px; font-size: 11px; font-family: monospace;
}
.bar-row:hover { background: #1a1a2e; }
.bar-row.highlight { background: rgba(38, 166, 154, 0.1); border-left: 3px solid #26a69a; }
.bar-time { width: 42px; color: #888; flex-shrink: 0; }
.bar-vol { width: 65px; text-align: right; }
.bar-trade { width: 50px; text-align: right; }
.bar-delta { width: 55px; text-align: right; }
.bar-flags { flex: 1; font-size: 9px; font-family: system-ui; }
.flag-tag {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    margin-left: 3px; font-weight: 600;
}
.flag-tag.buy { background: rgba(38,166,154,0.2); color: #26a69a; }
.flag-tag.vol { background: rgba(255,215,0,0.15); color: #ffd700; }
.flag-tag.big { background: rgba(100,180,255,0.15); color: #6bc5ff; }

.outfit-row {
    display: flex; align-items: center; padding: 5px 8px; border-radius: 4px;
    margin-bottom: 2px;
}
.outfit-row.top { background: rgba(255,215,0,0.06); border: 1px solid rgba(255,215,0,0.15); }
.outfit-rank { width: 20px; font-size: 10px; color: #555; font-weight: 700; }
.outfit-name { flex: 1; font-size: 11px; }
.outfit-hits {
    background: #1e1e2e; padding: 1px 6px; border-radius: 8px;
    font-size: 10px; font-weight: 700; min-width: 24px; text-align: center;
}
.outfit-row.top .outfit-hits { background: rgba(255,215,0,0.12); color: #ffd700; }

.sma-item { display: flex; align-items: center; padding: 3px 0; }
.sma-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
.sma-val { margin-left: auto; color: #666; font-family: monospace; font-size: 11px; }

.tooltip {
    display: none; position: absolute; background: rgba(8, 8, 16, 0.97);
    border: 1px solid #333; border-radius: 6px; padding: 10px 14px;
    font-size: 12px; pointer-events: none; z-index: 10;
    min-width: 220px; max-width: 340px;
}
.tooltip .tt-time { color: #888; margin-bottom: 4px; font-size: 11px; }
.tooltip .tt-ohlc { display: grid; grid-template-columns: auto auto; gap: 1px 10px; }
.tooltip .tt-label { color: #555; }

.crosshair-x, .crosshair-y { position: absolute; pointer-events: none; z-index: 5; }
.crosshair-x { width: 1px; height: 100%; border-left: 1px dashed rgba(255,255,255,0.1); }
.crosshair-y { height: 1px; width: 100%; border-top: 1px dashed rgba(255,255,255,0.1); }

.status-bar {
    background: #111118; border-top: 1px solid #1a1a2e;
    padding: 4px 16px; font-size: 10px; color: #444; display: flex; gap: 16px;
}
.status-bar span { color: #666; }

.no-data {
    display: flex; align-items: center; justify-content: center;
    height: 100%; font-size: 16px; color: #555; flex-direction: column; gap: 10px;
}
.no-data code { background: #1a1a2e; padding: 6px 14px; border-radius: 6px; font-size: 13px; color: #ffd700; }
</style>
</head>

function init() {
    const analysis = DATA.ma720_analysis || [];
    const baselines = DATA.ma720_baselines || {};

    const smaPeriod = DATA.sma_period || '720';
    document.getElementById('headerMeta').textContent =
        `${DATA.date} | ${DATA.interval} | ${DATA.candles.length} bars | US/Eastern`;
    document.getElementById('sidebarTitle').textContent =
        `MA${smaPeriod} Level — Institutional Activity`;
    document.getElementById('barsAtLabel').textContent =
        `Bars at MA${smaPeriod} (±$0.25)`;

    document.getElementById('sbInterval').textContent = DATA.interval;
    document.getElementById('sbBars').textContent = DATA.candles.length;
    document.getElementById('sbTZ').textContent = 'US/Eastern';
    document.getElementById('sbInteractions').textContent = DATA.interactions.length;
    document.getElementById('sbAtLevel').textContent = analysis.length;

    // Stat cards — reversal absorption metrics
    const totalVol = analysis.reduce((s, b) => s + b.volume, 0);
    const totalUp = analysis.reduce((s, b) => s + b.up_volume, 0);
    const totalDown = analysis.reduce((s, b) => s + b.down_volume, 0);
    const absorbedBars = analysis.filter(b => b.scores && b.scores.absorption && b.scores.absorption.absorbed).length;
    const wickBars = analysis.filter(b => b.scores && b.scores.rejection_wick && b.scores.rejection_wick.wick_below && b.scores.rejection_wick.closed_above).length;
    const bestComposite = analysis.length > 0
        ? Math.max(...analysis.map(b => (b.scores && b.scores._composite) || 0)) : 0;
    const dayVol = baselines.day_total_volume || 1;
    const volConc = (totalVol / dayVol * 100);

    document.getElementById('statGrid').innerHTML = `
        <div class="stat-card">
            <div class="stat-value ${absorbedBars > 0 ? 'green' : ''}">${absorbedBars}</div>
            <div class="stat-label">Absorption bars</div>
        </div>
        <div class="stat-card">
            <div class="stat-value ${wickBars > 0 ? 'green' : ''}">${wickBars}</div>
            <div class="stat-label">Rejection wicks</div>
        </div>
        <div class="stat-card">
            <div class="stat-value gold">${volConc.toFixed(1)}%</div>
            <div class="stat-label">Day vol at level</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${(totalVol/1000).toFixed(0)}K</div>
            <div class="stat-label">Volume at MA720</div>
        </div>
        <div class="stat-card">
            <div class="stat-value red">${((totalUp-totalDown)/1000).toFixed(0)}K</div>
            <div class="stat-label">Net delta (sellers)</div>
        </div>
        <div class="stat-card">
            <div class="stat-value ${bestComposite >= 0.3 ? 'green' : ''}">${bestComposite.toFixed(3)}</div>
            <div class="stat-label">Best composite</div>
        </div>
    `;

    // Bar list — reversal signals
    const barEl = document.getElementById('barList');
    barEl.innerHTML = analysis.map(b => {
        const s = b.scores || {};
        const flags = [];
        if (s.absorption && s.absorption.absorbed) flags.push('<span class="flag-tag buy">ABSORBED</span>');
        if (s.rejection_wick && s.rejection_wick.wick_below && s.rejection_wick.closed_above) flags.push('<span class="flag-tag buy">WICK REJECT</span>');
        if (b.vol_ratio >= 1.5) flags.push('<span class="flag-tag vol">HIGH VOL</span>');
        if (b.trade_size_sigma >= 1.0) flags.push('<span class="flag-tag big">LG TRADES</span>');
        const composite = s._composite || 0;
        const highlight = composite > 0.1;
        return `<div class="bar-row ${highlight ? 'highlight' : ''}">
            <div class="bar-time">${b.time_et}</div>
            <div class="bar-vol">${(b.volume/1000).toFixed(1)}K</div>
            <div class="bar-delta" style="color:${b.delta_pct>0?'#26a69a':'#ef5350'}">${b.delta_pct>0?'+':''}${b.delta_pct}%</div>
            <div style="width:45px;text-align:right;font-family:monospace;color:${composite>0.2?'#26a69a':'#666'}">${composite.toFixed(3)}</div>
            <div class="bar-flags">${flags.join('')}</div>
        </div>`;
    }).join('') || '<div style="color:#555;">No bars near MA720</div>';

    // Outfits
    document.getElementById('outfitList').innerHTML = DATA.rankings.slice(0, 8).map((r, i) =>
        `<div class="outfit-row ${i === 0 ? 'top' : ''}">

        const last = vals[vals.length - 1].value;

            <div class="sma-val">$${last.toFixed(2)}</div>
        </div>`;
    }).join('');

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    chartW = rect.width;
    chartH = rect.height - 30;
    plotW = chartW - CHART_PAD.left - CHART_PAD.right;
    plotH = chartH - CHART_PAD.top - CHART_PAD.bottom;
    computeScales();
    draw();
}

function computeScales() {
    if (!DATA) return;
    let lo = Infinity, hi = -Infinity;
    for (const c of DATA.candles) { if (c.low < lo) lo = c.low; if (c.high > hi) hi = c.high; }
    for (const p of Object.keys(DATA.sma_lines))
        for (const v of DATA.sma_lines[p])
            { if (v.value < lo) lo = v.value; if (v.value > hi) hi = v.value; }
    const pad = (hi - lo) * 0.05;
    priceMin = lo - pad; priceMax = hi + pad; priceRange = priceMax - priceMin;
    const n = DATA.candles.length;
    barWidth = Math.max(4, Math.floor(plotW / n * 0.6));
    barGap = (plotW - barWidth * n) / (n + 1);
}

function pY(p) { return CHART_PAD.top + plotH * (1 - (p - priceMin) / priceRange); }
function bX(i) { return CHART_PAD.left + barGap + i * (barWidth + barGap); }

function draw() {
    if (!DATA) return;
    ctx.clearRect(0, 0, chartW, chartH);
    drawGrid();
    drawMA720Zone();
    drawSMALines();
    drawCandles();
    drawBuyBubbles();
    drawInteractions();
    drawPriceAxis();
    drawTimeAxis();
}

function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
        const y = CHART_PAD.top + (plotH / 8) * i;
        ctx.beginPath(); ctx.moveTo(CHART_PAD.left, y); ctx.lineTo(chartW - CHART_PAD.right, y); ctx.stroke();
    }
}

function drawMA720Zone() {
    // Draw a horizontal band at MA720 ± proximity
    const analysis = DATA.ma720_analysis || [];
    if (!analysis.length) return;
    const ma = analysis[0].ma720;
    const band = DATA.ma720_baselines.proximity_dollars || 0.25;
    const yTop = pY(ma + band);
    const yBot = pY(ma - band);

    ctx.fillStyle = 'rgba(38, 166, 154, 0.04)';
    ctx.fillRect(CHART_PAD.left, yTop, plotW, yBot - yTop);

    // MA720 line
    ctx.strokeStyle = 'rgba(38, 166, 154, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(CHART_PAD.left, pY(ma));
    ctx.lineTo(chartW - CHART_PAD.right, pY(ma));
    ctx.stroke();
    ctx.setLineDash([]);

    // Label
    ctx.font = '10px system-ui';
    ctx.fillStyle = '#26a69a';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`MA${DATA.sma_period || '720'} $${ma.toFixed(2)}`, CHART_PAD.left + 4, pY(ma) - 3);
}

function drawSMALines() {
    const periods = Object.keys(DATA.sma_lines).sort((a, b) => +a - +b);
    const timeToIdx = {};
    DATA.candles.forEach((c, i) => { timeToIdx[c.time] = i; });

    periods.forEach((p, pi) => {
        const color = SMA_COLORS[pi % SMA_COLORS.length];
        const vals = DATA.sma_lines[p];
        ctx.strokeStyle = color;
        const isTarget = p === String(DATA.sma_period || '720');
        ctx.lineWidth = isTarget ? 2 : 1.2;
        ctx.globalAlpha = isTarget ? 0.9 : 0.5;
        ctx.beginPath();
        let started = false;
        for (const v of vals) {
            const idx = timeToIdx[v.time];
            if (idx === undefined) continue;
            const x = bX(idx) + barWidth / 2;
            const y = pY(v.value);
            if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    });
}

function drawCandles() {
    for (let i = 0; i < DATA.candles.length; i++) {
        const c = DATA.candles[i];
        const x = bX(i), mid = x + barWidth / 2;
        const bull = c.close >= c.open;
        const bTop = pY(Math.max(c.open, c.close));
        const bBot = pY(Math.min(c.open, c.close));

        ctx.strokeStyle = bull ? '#26a69a' : '#ef5350';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(mid, pY(c.high)); ctx.lineTo(mid, pY(c.low)); ctx.stroke();
        ctx.fillStyle = bull ? '#26a69a' : '#ef5350';
        ctx.fillRect(x, bTop, barWidth, Math.max(1, bBot - bTop));
    }
}

function drawBuyBubbles() {
    const analysis = DATA.ma720_analysis || [];
    if (!analysis.length) return;
    const timeToIdx = {};
    DATA.candles.forEach((c, i) => { timeToIdx[c.time] = i; });

    for (const b of analysis) {
        const idx = timeToIdx[b.time];
        if (idx === undefined) continue;

        const s = b.scores || {};
        const composite = s._composite || 0;
        if (composite <= 0) continue;  // skip bars with no signal

        const x = bX(idx) + barWidth / 2;
        const y = pY(b.ma720);

        // Bubble size scales with composite score
        const r = Math.min(35, Math.max(12, composite * 60 + 10));
        const alpha = Math.min(0.55, 0.1 + composite * 0.8);

        // Green for absorption/reversal
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r + 12);
        grad.addColorStop(0, `rgba(38, 166, 154, ${alpha})`);
        grad.addColorStop(1, 'rgba(38, 166, 154, 0)');
        ctx.beginPath();
        ctx.arc(x, y, r + 12, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(38, 166, 154, ${alpha * 0.6})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(38, 166, 154, ${Math.min(0.8, alpha + 0.2)})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Label: show what signals fired
        const labels = [];
        if (s.absorption && s.absorption.absorbed) labels.push('ABS');
        if (s.rejection_wick && s.rejection_wick.score > 0) labels.push('WCK');
        if (b.vol_ratio >= 1.5) labels.push(`${b.vol_ratio.toFixed(1)}x`);

        if (labels.length) {
            ctx.font = 'bold 8px system-ui';
            ctx.fillStyle = '#26a69a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(labels.join(' '), x, y);
        }
    }
}

function drawInteractions() {
    const timeToIdx = {};
    DATA.candles.forEach((c, i) => { timeToIdx[c.time] = i; });

    const grouped = {};
    for (const ix of DATA.interactions) {
        const key = `${ix.time}|${ix.price}`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(ix);
    }

    for (const key of Object.keys(grouped)) {
        const items = grouped[key];
        const ix = items[0];
        const idx = timeToIdx[ix.time];
        if (idx === undefined) continue;

        const x = bX(idx) + barWidth / 2;
        const y = pY(ix.price);
        const isTop = ix.outfit === DATA.top_outfit;
        const r = isTop ? 5 : 3;

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = isTop ? '#ffd700' : 'rgba(100,200,255,0.4)';
        ctx.globalAlpha = 0.8;
        ctx.fill();
        ctx.globalAlpha = 1.0;

        if (items.length > 1) {
            ctx.font = '8px system-ui'; ctx.fillStyle = '#000';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(items.length, x, y);
        }
    }
}

function drawPriceAxis() {
    ctx.fillStyle = '#444'; ctx.font = '10px monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 8; i++) {
        const price = priceMin + (priceRange / 8) * (8 - i);
        ctx.fillText('$' + price.toFixed(2), chartW - 6, CHART_PAD.top + (plotH / 8) * i);
    }
}

function drawTimeAxis() {
    ctx.fillStyle = '#444'; ctx.font = '10px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const step = Math.max(1, Math.floor(DATA.candles.length / 8));
    for (let i = 0; i < DATA.candles.length; i += step) {
        const x = bX(i) + barWidth / 2;
        ctx.fillText(parseETTime(DATA.candles[i].time) + ' ET', x, chartH - CHART_PAD.bottom + 6);
    }
}

function onMouseMove(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    document.getElementById('crossX').style.cssText =
        `display:block;left:${mx + rect.left - canvas.parentElement.getBoundingClientRect().left}px;top:${CHART_PAD.top}px;height:${plotH}px;`;
    document.getElementById('crossY').style.cssText =
        `display:block;top:${my}px;left:${CHART_PAD.left}px;width:${plotW}px;`;

    let closest = -1, closestDist = Infinity;
    DATA.candles.forEach((c, i) => {
        const d = Math.abs(mx - (bX(i) + barWidth / 2));
        if (d < closestDist) { closestDist = d; closest = i; }
    });

    if (closest >= 0 && closestDist < barWidth * 2) {
        const c = DATA.candles[closest];
        const timeStr = parseETTime(c.time) + ' ET';

        // Interactions
        const barIx = DATA.interactions.filter(ix => ix.time === c.time);
        let ixHtml = '';
        if (barIx.length) {
            ixHtml = `<div style="margin-top:5px;padding-top:5px;border-top:1px solid #222;">
                <div style="color:#ffd700;font-weight:600;font-size:10px;">Penny Interactions (${barIx.length})</div>
                ${barIx.map(ix => `<div style="font-size:10px;color:#888;">${ix.ohlc_field}=MA${ix.sma_period} $${ix.price} — ${ix.outfit}</div>`).join('')}
            </div>`;
        }

        // MA720 bar data — reversal signals
        const ma = (DATA.ma720_analysis || []).find(b => b.time === c.time);
        let maHtml = '';
        if (ma) {
            const s = ma.scores || {};
            const abs = s.absorption || {};
            const wick = s.rejection_wick || {};
            const conc = s.volume_concentration || {};
            const trd = s.trade_size || {};
            maHtml = `<div style="margin-top:5px;padding-top:5px;border-top:1px solid #222;">
                <div style="color:#26a69a;font-weight:600;font-size:10px;">MA${DATA.sma_period || '720'} $${ma.ma720} — Institutional Signals</div>
                <div style="font-size:10px;color:#aaa;line-height:1.6;">
                    Volume: ${ma.volume.toLocaleString()} (${ma.vol_ratio.toFixed(1)}x avg)<br>
                    Delta: <span style="color:#ef5350">${ma.delta_pct>0?'+':''}${ma.delta_pct}%</span>
                    (sell=${ma.down_volume.toLocaleString()})<br>
                    <span style="color:${abs.absorbed?'#26a69a':'#555'};">Absorption: ${abs.score ? abs.score.toFixed(3) : '—'}${abs.absorbed ? ' ✓ ABSORBED' : ''}</span><br>
                    <span style="color:${wick.score>0?'#26a69a':'#555'};">Wick rejection: ${wick.score ? wick.score.toFixed(3) : '—'}${wick.wick_below && wick.closed_above ? ' ✓ REJECTED' : ''}</span><br>
                    <span style="color:${conc.pct_of_day>5?'#ffd700':'#555'};">Vol concentration: ${conc.pct_of_day ? conc.pct_of_day.toFixed(1) : '—'}% of day</span><br>
                    <span style="color:${trd.sigma>=1?'#6bc5ff':'#555'};">Trade size: ${trd.sigma ? trd.sigma.toFixed(1) : '—'}σ</span><br>
                    <b style="color:#26a69a;">Composite: ${(s._composite || 0).toFixed(3)}</b>
                </div>
            </div>`;
        }

        const tt = document.getElementById('tooltip');
        tt.innerHTML = `
            <div class="tt-time">${timeStr}</div>
            <div class="tt-ohlc">
                <span class="tt-label">O</span><span>$${c.open.toFixed(2)}</span>
                <span class="tt-label">H</span><span>$${c.high.toFixed(2)}</span>
                <span class="tt-label">L</span><span>$${c.low.toFixed(2)}</span>
                <span class="tt-label">C</span><span>$${c.close.toFixed(2)}</span>
                <span class="tt-label">V</span><span>${c.volume.toLocaleString()}</span>
            </div>${ixHtml}${maHtml}`;
        tt.style.display = 'block';
        let tx = mx + 16, ty = my - 10;
        if (tx + 300 > chartW) tx = mx - 300;
        if (ty + 250 > chartH) ty = chartH - 260;
        tt.style.left = tx + 'px'; tt.style.top = ty + 'px';
    } else {
        document.getElementById('tooltip').style.display = 'none';
    }
}

function onMouseLeave() {
    document.getElementById('tooltip').style.display = 'none';
    document.getElementById('crossX').style.display = 'none';
    document.getElementById('crossY').style.display = 'none';
}

loadData();
</script>
</body>
